spring:
    profiles:
        active: ${AGILERY_ACTIVE_PROFILE:default}

    application:
        name: Todo Service

    # This section defines the defaults for the data source
    datasource:
        username: ${AGILERY_DATABASE_USERNAME:sa}
        password: ${AGILERY_DATABASE_PASSWORD:pass}
    sql:
        init:
            mode: always
            schema-locations: classpath:init.sql

    # This section defines defauilts for the jackson JSON library
    jackson:
        default-property-inclusion: NON_NULL

    # This section defines defaulits for the feign client
    cloud:
        openfeign:
            client:
                config:
                    default:
                        # url: http://remote-service.com
                        connect-timeout: 10000
                        read-timeout: 20000
                        logger-level: full
#                        error-decoder: ai.agilery.order.config.CustomErrorDecoder
#                        retryer: ai.agilery.order.config.CustomRetryer
#                        defaultQueryParameters:
#                            query: queryValue
#                        defaultRequestHeaders:
#                            header: headerValue
#                        requestInterceptors:
#                            - com.example.FooRequestInterceptor
#                        responseInterceptor: com.example.BazResponseInterceptor
#                        dismiss404: false
#                        encoder: com.example.SimpleEncoder
#                        decoder: com.example.SimpleDecoder
#                        contract: com.example.SimpleContract
#                        capabilities:
#                            - com.example.FooCapability
#                            - com.example.BarCapability
#                        queryMapEncoder: com.example.SimpleQueryMapEncoder
#                        micrometer: true

    # This ection enables the JMX
    jmx:
        enabled: true
        default-domain: ai.agilery

management:

    # Management endpoint configuration
    endpoints:
        # Configuration for web interface
        web:
            exposure:
                include: info,health,metrics,sbom
        # Configuraiton for JMX interface
        jmx:
            exposure:
                include: "*"
            domain: "ai.agilery.management"

    jmx:
        metrics:
            export:
                enabled: true

# Defaults for embedded HTTP server
server:
    forward-headers-strategy: framework
    servlet:
        context-path: /${AGILERY_SERVICE_NAME:}
    port: ${AGILERY_PORT_NUMBER:8080}
    # Embedded tomcat server settings
    tomcat:
        accesslog:
            enabled: true
            pattern: "%t %I %a %l %u \"%r\" %s %b %D"
            # %t – the time the request was received
            # %I - Current request thread name (can compare later with stacktraces)
            # %a – the remote IP address
            # %l – the identity of the user
            # %u – the user name determined by HTTP authentication
            # %r – the request line from the client, GET /greetings/Harry HTTP/1.1 in this case
            # %s – the status code sent from the server to the client, like 200 here
            # %b – the size of the response to the client, or 27 for these requests
            # %D - the response time in ms
            max-days: 2
        basedir: tomcat

springdoc:
  show-actuator: true

# Feign client retry configuration parameters
feign:
  client:
    retry:
      maximum-attempts: 3
      backoff-period: 2000
      maximum-period: 30000
